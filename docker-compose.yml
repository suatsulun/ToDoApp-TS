services:
  db:
    image: postgres:18
    container_name: todos-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todos
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
  
  backend:
    build: ./backend
    container_name: todos-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/todos
  
  frontend:
    build: ./frontend
    container_name: todos-frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
